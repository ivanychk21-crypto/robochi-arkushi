<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Робочий аркуш</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E1; --cream-light:#FEFBF4;
    --teal:#2E7D6B; --teal-dark:#1E5A4C; --teal-pale:#E1EFE9;
    --ink:#233731; --gold:#E3A23A; --coral:#D8734F;
    --line:#CFE3DA; --danger:#B4483A; --ok:#2E7D6B;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito',sans-serif;background:#EEF3EF;color:var(--ink);padding:24px 12px 50px;}
  .app{max-width:820px;margin:0 auto;}
  @media print{ body{background:#fff;padding:0;} .sheet{border-radius:0;} .no-print{display:none !important;} }

  .status-box{background:var(--cream-light);border:2px solid var(--teal-pale);border-radius:16px;padding:30px;text-align:center;font-size:1rem;color:var(--teal-dark);font-weight:700;}
  .status-box.error{border-color:var(--danger);color:var(--danger);}
  .spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--teal-pale);border-top-color:var(--teal);animation:spin 0.8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .top-btn-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;}
  .top-btn-row button{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.9rem;border:none;padding:11px 20px;border-radius:10px;cursor:pointer;}
  .top-btn-row button.primary{background:var(--teal);color:#fff;}
  .top-btn-row button.secondary{background:#fff;color:var(--teal-dark);border:2px solid var(--teal);}
  .top-btn-row button:disabled{opacity:0.6;cursor:wait;}

  .sheet{background:var(--cream-light);border:3px solid var(--teal);border-radius:20px;padding:26px 30px 30px;position:relative;overflow:hidden;}
  .meta-line{display:flex;gap:26px;flex-wrap:wrap;font-size:0.9rem;font-weight:700;color:var(--teal-dark);margin-bottom:16px;}
  .meta-blank{display:inline-block;border-bottom:2px dotted var(--teal);min-width:120px;height:1.1em;margin-left:4px;}
  .hero{display:flex;align-items:center;justify-content:center;gap:16px;text-align:center;margin-bottom:18px;}
  .hero-photo{flex:0 0 auto;width:84px;height:84px;border-radius:14px;overflow:hidden;border:3px solid var(--teal-pale);box-shadow:0 2px 0 var(--teal-pale);}
  .hero-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-text{max-width:640px;}
  .hero-text h2{font-family:'Comfortaa',sans-serif;color:var(--teal-dark);font-size:1.4rem;margin:0 0 5px;}
  .hero-text h3{font-family:'Nunito',sans-serif;font-weight:700;color:var(--coral);font-size:0.96rem;margin:0;line-height:1.35;}
  .divider{height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px, transparent 10px 18px);margin:0 0 18px;border-radius:3px;}
  .columns{column-count:2;column-gap:24px;}
  @media (max-width:720px){.columns{column-count:1;}}
  .card{break-inside:avoid;-webkit-column-break-inside:avoid;background:#fff;border:2px solid var(--teal-pale);border-radius:14px;margin-bottom:18px;overflow:hidden;box-shadow:0 2px 0 var(--teal-pale);}
  .card-header{background:var(--teal);color:#fff;padding:9px 13px;display:flex;align-items:center;gap:9px;}
  .card-header .badge{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-family:'Comfortaa',sans-serif;font-weight:700;font-size:0.8rem;}
  .card-header .icon{font-size:1.05rem;}
  .card-header h4{font-family:'Comfortaa',sans-serif;font-size:0.94rem;margin:0;font-weight:700;line-height:1.2;}
  .card-body{padding:12px 14px 14px;font-size:0.88rem;line-height:1.5;}
  .card-body p.instr{margin:0 0 8px;color:#3f524c;}
  .q-item{margin-bottom:8px;}
  .q-item .q-text{font-weight:700;margin-bottom:3px;}
  .timeline-vertical{position:relative;padding:2px 0;}
  .tl-row{display:flex;align-items:flex-start;gap:12px;position:relative;margin-bottom:12px;}
  .tl-row:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:-12px;width:2px;background:var(--teal-pale);}
  .tl-order-input{flex:0 0 auto;width:29px !important;height:29px;padding:2px !important;text-align:center;position:relative;z-index:1;}
  .tl-label{padding-top:5px;font-size:0.83rem;font-weight:600;color:var(--ink);line-height:1.4;}
  .match-grid{display:flex;gap:12px;}
  .match-col{flex:1;}
  .match-item{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:0.86rem;}
  .match-num{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--teal-pale);color:var(--teal-dark);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:0.76rem;}
  .excerpt{background:var(--teal-pale);border-left:4px solid var(--teal);padding:9px 13px;border-radius:6px;font-style:italic;margin-bottom:10px;font-size:0.87rem;}
  table.gen-table{width:100%;border-collapse:collapse;font-size:0.82rem;}
  table.gen-table th{background:var(--teal);color:#fff;padding:7px;text-align:left;font-family:'Comfortaa',sans-serif;font-size:0.76rem;}
  table.gen-table td{border:1.4px solid var(--teal-pale);padding:8px 7px;vertical-align:top;min-height:34px;}
  table.gen-table td.rowlabel{font-weight:700;background:#FBF7EC;}
  table.gen-table td input{width:100%;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:0.82rem;}
  .mindmap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px 6px;}
  .mm-side{display:flex;flex-direction:column;gap:8px;}
  .mm-node{border:2px dashed var(--gold);border-radius:999px;padding:10px 8px;text-align:center;font-size:0.74rem;font-weight:700;color:var(--teal-dark);background:#FEFCF6;min-height:2.2em;display:flex;align-items:center;justify-content:center;}
  .mm-center{width:105px;height:105px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Comfortaa',sans-serif;font-size:0.76rem;font-weight:700;padding:8px;margin:0 auto;}
  .terms-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .term-box{background:#FBF7EC;border:1.6px solid var(--gold);border-radius:10px;padding:7px 9px;}
  .term-box .term-name{font-weight:800;color:var(--coral);font-size:0.82rem;margin-bottom:5px;}
  .seq-item{display:flex;gap:7px;align-items:center;margin-bottom:7px;font-size:0.86rem;}
  .tf-item{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;font-size:0.86rem;}
  .tf-opts{display:flex;gap:6px;flex:0 0 auto;}
  .tf-opts span{border:1.6px solid var(--teal);border-radius:6px;padding:2px 8px;font-size:0.74rem;font-weight:700;color:var(--teal-dark);cursor:pointer;}
  .tf-opts span.selected{background:var(--teal);color:#fff;}
  .disc-item{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:0.86rem;}
  .disc-item .dq{display:flex;gap:7px;} .disc-item .dot{color:var(--coral);font-weight:900;}

  .ans-input{width:100%;border:1.6px solid var(--teal);border-radius:6px;padding:5px 8px;font-family:'Nunito',sans-serif;font-size:0.86rem;background:#FEFDF9;}
  .ans-input-tiny{width:34px;border:1.6px solid var(--teal);border-radius:6px;padding:4px;text-align:center;font-weight:700;font-family:'Nunito',sans-serif;flex:0 0 auto;background:#FEFDF9;}
  textarea.ans-input{resize:vertical;min-height:2em;}
  .inline-blank{display:inline-block;width:110px;margin:0 4px;vertical-align:middle;}
  .cite-field{margin-top:4px;padding:6px 8px;background:#FBF7EC;border:1px dashed var(--gold);border-radius:6px;}
  .cite-label{display:block;font-size:0.72rem;color:#8a6d2e;font-weight:700;margin-bottom:3px;}
  .cite-input{width:100%;border:1.4px solid var(--gold);border-radius:5px;padding:4px 7px;font-family:'Nunito',sans-serif;font-size:0.78rem;font-style:italic;background:#fff;}

  .confirm-card{background:#E7F5EE;border:3px solid var(--ok);border-radius:20px;padding:32px 28px;text-align:center;}
  .confirm-card h2{color:var(--teal-dark);font-family:'Comfortaa',sans-serif;margin:0 0 14px;font-size:1.4rem;}
  .confirm-card .code{font-family:'Comfortaa',sans-serif;font-size:2rem;font-weight:700;letter-spacing:4px;color:var(--teal-dark);background:#fff;border:2px dashed var(--teal);border-radius:12px;padding:14px 20px;display:inline-block;margin:12px 0;}
  .confirm-card .details{font-size:0.9rem;color:#3f524c;margin:6px 0;}
  .confirm-card .warn{background:#FFF8E6;border:1.6px solid var(--gold);border-radius:10px;padding:12px 16px;margin-top:16px;font-size:0.86rem;color:#6b5410;text-align:left;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="status-box" id="statusBox"><div class="spinner"></div>Завантажую завдання…</div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const WS_ID = qs.get('ws');
const API_URL = qs.get('api') ? decodeURIComponent(qs.get('api')) : null;

const typeIcons = { recall:"❓", timeline:"🕒", matching:"🧩", detective:"🔍", table:"📊", mindmap:"🧠", terms_list:"📖", discussion:"💬", sequence:"✅", truefalse:"⚖️", fillblank:"✏️", creative:"🖋️" };
function esc(s){ if(s===undefined||s===null) return ""; const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
const appEl = document.getElementById('app');

function showError(msg){
  appEl.innerHTML = `<div class="status-box error">⚠️ ${esc(msg)}</div>`;
}

if(!WS_ID || !API_URL){
  showError("Некоректне посилання: відсутній ідентифікатор аркуша або адреса бекенду.");
}else{
  loadWorksheet();
}

async function loadWorksheet(){
  try{
    const resp = await fetch(`${API_URL}?action=getWorksheet&id=${encodeURIComponent(WS_ID)}`);
    if(!resp.ok) throw new Error("Сервер повернув помилку " + resp.status);
    const data = await resp.json();
    if(!data){ showError("Аркуш із таким ідентифікатором не знайдено. Перевірте посилання у вчителя."); return; }
    renderWorksheet(data);
  }catch(err){
    showError("Не вдалося завантажити аркуш: " + err.message);
  }
}

let CITATIONS_ENABLED = false;
function citeFieldHTML(bi, i){
  return `<div class="cite-field"><span class="cite-label">📖 Звідки в тексті? (коротка фраза з параграфа, де це написано)</span><input type="text" class="ans-field cite-input" data-ans-id="b${bi}-${i}-cite" placeholder="Скопіюйте чи спишіть фразу з тексту"></div>`;
}
function renderInteractiveBlockBody(block, bi){
  switch(block.type){
    case "recall": return (block.questions||[]).map((q,i)=>{ const n=(block.answer_lines&&block.answer_lines[i])||1; const field = n<=1 ? `<input type="text" class="ans-field ans-input" data-ans-id="b${bi}-${i}">` : `<textarea rows="${n}" class="ans-field ans-input" data-ans-id="b${bi}-${i}"></textarea>`; return `<div class="q-item"><div class="q-text">${esc(q)}</div>${field}${CITATIONS_ENABLED?citeFieldHTML(bi,i):""}</div>`; }).join("");
    case "timeline": { const items=(block.events||[]).map((ev,i)=>`<div class="tl-row"><input type="text" maxlength="1" class="ans-field ans-input-tiny tl-order-input" data-ans-id="b${bi}-${i}"><div class="tl-label">${esc(ev)}</div></div>`).join(""); return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}<div class="timeline-vertical">${items}</div>`; }
    case "matching": { const left=block.left||[], right=block.right||[]; const letters="АБВГДЕЖЗ";
      const leftHtml = left.map((t,i)=>`<div class="match-item"><input type="text" maxlength="2" class="ans-field ans-input-tiny" data-ans-id="b${bi}-${i}"><span class="match-num">${i+1}</span>${esc(t)}</div>`).join("");
      const rightHtml = right.map((t,i)=>`<div class="match-item"><b>${letters[i]||i+1}.</b>&nbsp;${esc(t)}</div>`).join("");
      return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}<div class="match-grid"><div class="match-col">${leftHtml}</div><div class="match-col">${rightHtml}</div></div>`; }
    case "detective": return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}<div class="excerpt">${esc(block.excerpt||"")}</div>${(block.questions||[]).map((q,i)=>{ const n=(block.answer_lines&&block.answer_lines[i])||2; const field = n<=1 ? `<input type="text" class="ans-field ans-input" data-ans-id="b${bi}-${i}">` : `<textarea rows="${n}" class="ans-field ans-input" data-ans-id="b${bi}-${i}"></textarea>`; return `<div class="q-item"><div class="q-text">${esc(q)}</div>${field}${CITATIONS_ENABLED?citeFieldHTML(bi,i):""}</div>`; }).join("")}`;
    case "table": { const cols=block.columns||[], rows=block.rows||[]; const thead=`<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>`; const tbody=rows.map((r,ri)=>`<tr><td class="rowlabel">${esc(r)}</td>${cols.slice(1).map((c,ci)=>`<td><input type="text" class="ans-field" data-ans-id="b${bi}-${ri}-${ci}"></td>`).join("")}</tr>`).join(""); return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}<table class="gen-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`; }
    case "mindmap": { const nodes=block.nodes||["1","2","3","4","5","6"]; const half=Math.ceil(nodes.length/2); const mk=(n,i)=>`<div class="mm-node ans-field" contenteditable="true" data-ans-id="b${bi}-${i}" data-kind="text">${esc(n)}</div>`; return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}<div class="mindmap"><div class="mm-side">${nodes.slice(0,half).map((n,i)=>mk(n,i)).join("")}</div><div class="mm-center">${esc(block.center||"Тема")}</div><div class="mm-side">${nodes.slice(half).map((n,i)=>mk(n,i+half)).join("")}</div></div>`; }
    case "terms_list": return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}<div class="terms-grid">${(block.terms||[]).map((t,i)=>{ const n=(block.answer_lines&&block.answer_lines[i])||2; const field = n<=1 ? `<input type="text" class="ans-field ans-input" data-ans-id="b${bi}-${i}">` : `<textarea rows="${n}" class="ans-field ans-input" data-ans-id="b${bi}-${i}"></textarea>`; return `<div class="term-box"><div class="term-name">${esc(t)}</div>${field}</div>`; }).join("")}</div>`;
    case "discussion": return (block.questions||[]).map((q,i)=>{ const n=(block.answer_lines&&block.answer_lines[i])||3; return `<div class="disc-item"><div class="dq"><span class="dot">•</span><span>${esc(q)}</span></div><textarea rows="${n}" class="ans-field ans-input" data-ans-id="b${bi}-${i}"></textarea></div>`; }).join("");
    case "sequence": return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}${(block.items||[]).map((it,i)=>`<div class="seq-item"><input type="text" maxlength="1" class="ans-field ans-input-tiny" data-ans-id="b${bi}-${i}"><span>${esc(it)}</span></div>`).join("")}`;
    case "truefalse": return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}${(block.statements||[]).map((s,i)=>`<div class="tf-item" data-ans-id="b${bi}-${i}" data-kind="choice"><span>${esc(s)}</span><span class="tf-opts"><span class="tf-choice" data-value="так" onclick="toggleChoice(this)">Так</span><span class="tf-choice" data-value="ні" onclick="toggleChoice(this)">Ні</span></span></div>`).join("")}`;
    case "fillblank": return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}${(block.sentences||[]).map((s,i)=>{ const ans=(block.answer_key&&block.answer_key[i])||""; const w= ans ? Math.max(9, Math.min(28, ans.length+4)) : 14; return `<div class="q-item"><div class="q-text">${esc(s).replace(/_{2,}/, `<input type="text" class="ans-field ans-input-tiny inline-blank" style="width:${w}ch;" data-ans-id="b${bi}-${i}">`)}</div></div>`; }).join("")}`;
    case "creative": { const n=block.lines||6; return `${block.instruction?`<p class="instr">${esc(block.instruction)}</p>`:""}<textarea rows="${Math.max(4,n)}" class="ans-field ans-input" data-ans-id="b${bi}-creative" style="width:100%;"></textarea>`; }
    default: return "";
  }
}

function toggleChoice(el){ const p = el.parentElement; p.querySelectorAll('.tf-choice').forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); }
window.toggleChoice = toggleChoice;

let currentTopic = "";
const SUBJECT_COLORS = {
  history: "--teal:#2E7D6B;--teal-dark:#1E5A4C;--teal-pale:#E1EFE9;--gold:#E3A23A;--coral:#D8734F;",
  computer_science: "--teal:#2E5C99;--teal-dark:#1E3D66;--teal-pale:#E2EAF5;--gold:#4FB0C9;--coral:#7B5FD1;"
};
function subjectStyleAttr(subject){ return SUBJECT_COLORS[subject] || SUBJECT_COLORS.history; }
function renderWorksheet(data){
  CITATIONS_ENABLED = !!data.citationsEnabled;
  currentTopic = data.topic || "Робочий аркуш";
  const blocks = data.blocks || [];
  const cardsHtml = blocks.map((b,i)=>`<div class="card"><div class="card-header"><div class="badge">${i+1}</div><div class="icon">${typeIcons[b.type]||"📌"}</div><h4>${esc(b.title||"Завдання")}</h4></div><div class="card-body">${renderInteractiveBlockBody(b,i)}</div></div>`).join("");
  appEl.innerHTML = `
    <div class="top-btn-row no-print"><button class="secondary" id="printBtn">🖨️ Друк / PDF</button><button class="primary" id="submitBtn">✅ Здати роботу</button></div>
    <div class="sheet" id="sheet" style="${subjectStyleAttr(data.subject)}">
      <div class="meta-line"><span>Дата <span class="meta-blank"></span></span><span>Прізвище, ім'я <input type="text" class="ans-input" id="studentNameField" style="min-width:220px;display:inline-block;width:auto;"></span></div>
      <div class="hero"><div class="hero-text"><h2>${esc(data.topic||"Робочий аркуш")}</h2>${data.subtitle?`<h3>${esc(data.subtitle)}</h3>`:""}</div></div>
      <div class="divider"></div><div class="columns">${cardsHtml}</div>
    </div>`;
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());
  document.getElementById('submitBtn').addEventListener('click', submitWork);
}

async function submitWork(){
  const nameField = document.getElementById('studentNameField');
  const studentName = (nameField && nameField.value.trim()) || "";
  if(!studentName){ alert("Будь ласка, впишіть своє ім'я та прізвище перед здачею роботи."); nameField.focus(); return; }

  const sheetEl = document.getElementById('sheet');
  const answers = {};
  sheetEl.querySelectorAll('.ans-field').forEach(function(el){
    const id = el.dataset.ansId; if(!id) return;
    if(el.dataset.kind === 'text' && el.isContentEditable){ answers[id] = el.innerText.trim(); }
    else if(el.tagName==='TEXTAREA' || el.tagName==='INPUT'){ answers[id] = el.value.trim(); }
  });
  sheetEl.querySelectorAll('[data-kind="choice"]').forEach(function(box){
    const id = box.dataset.ansId; const sel = box.querySelector('.tf-choice.selected');
    answers[id] = sel ? sel.dataset.value : "";
  });

  const submitBtn = document.getElementById('submitBtn');
  const orig = submitBtn.textContent;
  submitBtn.disabled = true; submitBtn.textContent = "⏳ Здаю…";

  const payload = { type: 'submission', worksheetId: WS_ID, topic: currentTopic, studentName: studentName, answers: answers };

  try{
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight with Apps Script
      body: JSON.stringify(payload)
    });
    const result = await resp.json();
    if(result.status !== 'ok') throw new Error(result.message || "Сервер відхилив здачу роботи.");

    const submittedDate = result.submittedAt ? new Date(result.submittedAt) : new Date();
    appEl.innerHTML = `
      <div class="confirm-card">
        <h2>🎉 Роботу здано!</h2>
        <div class="details"><b>${esc(studentName)}</b></div>
        <div class="details">${esc(currentTopic)}</div>
        <div class="details">${submittedDate.toLocaleString('uk-UA')}</div>
        <div class="code">${esc(result.confirmationCode || "—")}</div>
        <div class="warn">📸 <b>Зробіть скріншот цього екрана</b> — це ваш доказ здачі роботи разом із кодом підтвердження, датою й часом. Збережіть його на випадок будь-яких технічних збоїв.</div>
      </div>`;
  }catch(err){
    submitBtn.disabled = false; submitBtn.textContent = orig;
    alert("Не вдалося здати роботу: " + err.message + "\\n\\nПеревірте інтернет-з'єднання і спробуйте ще раз. Якщо помилка повторюється — повідомте вчителя і зробіть скріншот заповненого аркуша як тимчасовий доказ.");
  }
}
</script>
</body>
</html>
